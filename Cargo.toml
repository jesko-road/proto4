[package]
name = "proto4"
version = "0.1.0"
edition = "2024"

[dependencies]
chacha20poly1305 = "0.10"
flate2 = "1"
once_cell = "1.21.4"
rand = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
tokio = { version = "1.52.3", features = ["io-util", "macros", "rt", "rt-multi-thread"] }
