[package]
name = "proto4"
version = "0.1.0"
edition = "2024"

[dependencies]
chacha20poly1305 = "0.10"
flate2 = "1"
once_cell = "1.21.4"
rand = "0.8"
tokio = { version = "1.52.3", features = ["io-util", "net"] }

[dev-dependencies]
tokio = { version = "1.52.3", features = ["io-util", "macros", "rt", "rt-multi-thread"] }
